# Docker internal DNS resolver — re-resolves on every request
# Prevents 502 after container recreation (new IP)
resolver 127.0.0.11 valid=10s ipv6=off;

# api.bensseg.com → ERP server
server {
    listen 443 ssl;
    server_name api.bensseg.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin-key.pem;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    set $backend_server http://server:3001;

    location / {
        proxy_pass $backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bull-board {
        proxy_pass $backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# chat.bensseg.com → Chat server + Socket.IO
server {
    listen 443 ssl;
    server_name chat.bensseg.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin-key.pem;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    set $backend_chat http://chat-server:3002;

    location / {
        proxy_pass $backend_chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — WebSocket upgrade required
    location /socket.io/ {
        proxy_pass $backend_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.bensseg.com chat.bensseg.com;
    return 301 https://$host$request_uri;
}
