name: Deploy Chat

on:
  push:
    branches: [main]
    paths:
      - 'apps/chat-server/**'
      - 'apps/chat-worker/**'
      - 'packages/db-chat/**'
      - 'packages/ai/**'
      - 'packages/env/**'
      - 'packages/shared/**'
      - 'Dockerfile.chat'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chat
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-chat:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bens-seguros
            docker compose -f docker-compose.prod.yml pull chat-server
            docker compose -f docker-compose.prod.yml up -d chat-server chat-worker
