name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/worker/**'
      - 'packages/core/**'
      - 'packages/db/**'
      - 'packages/auth/**'
      - 'packages/env/**'
      - 'packages/shared/**'
      - 'Dockerfile.server'
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" pnpm --filter @repo/db exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-and-push:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-server:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bens-seguros
            SHA_SHORT=${{ needs.build-and-push.outputs.sha_short }}

            # Save current running tag for rollback
            PREV_TAG=$(cat .current-tag 2>/dev/null || echo "none")

            # Pull new images using SHA tag
            export TAG=${SHA_SHORT}
            docker compose -f docker-compose.prod.yml pull server worker

            # TODO: Add prisma migrate deploy when migration files exist
            # and prisma CLI is available in the runner image

            # Deploy with new images
            docker compose -f docker-compose.prod.yml up -d server worker

            # Wait for health checks (start_period=30s + interval=30s + margin)
            sleep 70

            # Verify server is healthy
            HEALTHY=$(docker compose -f docker-compose.prod.yml ps server --format json | grep -c '"healthy"' || true)
            if [ "$HEALTHY" -lt 1 ]; then
              echo "Health check failed! Rolling back to ${PREV_TAG}..."
              if [ "$PREV_TAG" != "none" ]; then
                export TAG=${PREV_TAG}
                docker compose -f docker-compose.prod.yml up -d server worker
              fi
              exit 1
            fi

            # Save successful tag for future rollbacks
            echo "${SHA_SHORT}" > .current-tag
            echo "Deploy successful! Tag: ${SHA_SHORT}"
