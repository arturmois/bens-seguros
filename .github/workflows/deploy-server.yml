name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/worker/**'
      - 'packages/core/**'
      - 'packages/db/**'
      - 'packages/auth/**'
      - 'packages/env/**'
      - 'packages/shared/**'
      - 'Dockerfile.server'
      - 'pnpm-lock.yaml'
      - 'nginx/**'
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" pnpm --filter @repo/db exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-and-push:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-server:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nginx
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: nginx/prod.conf
          target: /opt/bens-seguros
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bens-seguros
            SHA_SHORT=${{ needs.build-and-push.outputs.sha_short }}

            # Save current running tag for rollback
            PREV_TAG=$(cat .current-tag 2>/dev/null || echo "none")

            # Pull new images using SHA tag
            export TAG=${SHA_SHORT}
            docker compose -f docker-compose.prod.yml pull server worker

            # TODO: Add prisma migrate deploy when migration files exist
            # and prisma CLI is available in the runner image

            # Deploy with new images
            docker compose -f docker-compose.prod.yml up -d server worker

            # Update nginx config and reload (resolver fix prevents 502 after container IP change)
            if [ -f nginx/prod.conf ]; then
              docker cp nginx/prod.conf bens-seguros-nginx-1:/etc/nginx/conf.d/prod.conf
              docker exec bens-seguros-nginx-1 nginx -t && docker exec bens-seguros-nginx-1 nginx -s reload
            fi

            # Wait for health checks (start_period=30s + interval=30s + margin)
            sleep 70

            # Verify server is healthy
            HEALTHY=$(docker compose -f docker-compose.prod.yml ps server --format json | grep -c '"healthy"' || true)
            if [ "$HEALTHY" -lt 1 ]; then
              echo "Health check failed! Rolling back to ${PREV_TAG}..."
              if [ "$PREV_TAG" != "none" ]; then
                export TAG=${PREV_TAG}
                docker compose -f docker-compose.prod.yml up -d server worker
              fi
              exit 1
            fi

            # Smoke test: verify cross-subdomain auth cookies have Domain attribute
            COOKIE_CHECK=$(curl -s -D - -X POST https://api.bensseg.com/api/auth/sign-in/email \
              -H "Content-Type: application/json" \
              -d '{"email":"smoke-test@bensseg.com","password":"invalid"}' \
              2>&1 | grep -c "Domain=bensseg.com" || true)
            # Even a failed login should return Set-Cookie with Domain on 200/401
            # If Domain is missing, cookies won't work cross-subdomain
            if [ "$COOKIE_CHECK" -lt 1 ]; then
              echo "WARNING: Cross-subdomain cookie Domain attribute missing!"
              echo "Auth may not work between app.bensseg.com and api.bensseg.com"
              # Don't rollback — but alert. Auth config issue, not crash.
            fi

            # Save successful tag for future rollbacks
            echo "${SHA_SHORT}" > .current-tag
            echo "Deploy successful! Tag: ${SHA_SHORT}"
