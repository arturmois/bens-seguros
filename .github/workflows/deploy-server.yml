name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/worker/**'
      - 'packages/core/**'
      - 'packages/db/**'
      - 'packages/auth/**'
      - 'packages/env/**'
      - 'packages/shared/**'
      - 'Dockerfile.server'
      - 'pnpm-lock.yaml'
      - 'nginx/**'
      - 'scripts/deploy.sh'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gates:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bens-server:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            nginx
            scripts/deploy.sh
            docker-compose.prod.yml
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: nginx/prod.conf,scripts/deploy.sh,docker-compose.prod.yml
          target: /opt/bens-seguros
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /opt/bens-seguros/scripts/deploy.sh
            /opt/bens-seguros/scripts/deploy.sh server ${{ needs.build-and-push.outputs.sha_short }}
