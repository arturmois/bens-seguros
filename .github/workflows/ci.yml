name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bens
          POSTGRES_PASSWORD: bens_dev
          POSTGRES_DB: bens_seguros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bens -d bens_seguros"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app_user:bens_app@localhost:5432/bens_seguros
      DATABASE_ADMIN_URL: postgresql://bens:bens_dev@localhost:5432/bens_seguros
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security audit
        run: pnpm audit --audit-level high
        continue-on-error: true
      - run: DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" pnpm --filter @repo/db db:generate
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create app_user role
        env:
          PGPASSWORD: bens_dev
        run: psql -h localhost -U bens -d bens_seguros -c "CREATE ROLE app_user LOGIN PASSWORD 'bens_app' NOSUPERUSER"
      - name: Write .env for db:push:dev
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://app_user:bens_app@localhost:5432/bens_seguros' \
            'DATABASE_ADMIN_URL=postgresql://bens:bens_dev@localhost:5432/bens_seguros' \
            > .env
      - run: pnpm db:push:dev
      - name: Architecture deps (warn)
        run: pnpm arch:check
        continue-on-error: true
      - run: pnpm test:architecture
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        if: github.event_name == 'pull_request'
      - run: pnpm test
      - name: Coverage report
        run: pnpm exec turbo test -- --coverage --coverage.reporter=json-summary --coverage.reporter=text
        continue-on-error: true
      - name: Quality Gates (passive — não bloqueia merge)
        if: github.event_name == 'pull_request'
        run: node .quality-gates/quality-gate.mjs --check
        continue-on-error: true
      - name: Upload quality gates report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-report
          path: .quality-gates/output/
          retention-days: 14
      - name: Comentário no PR com diff vs baseline
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-gates
          path: .quality-gates/output/report.md
