name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security audit
        run: pnpm audit --audit-level high
        continue-on-error: true
      - run: DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" pnpm --filter @repo/db db:generate
      - name: Architecture deps (warn)
        run: pnpm arch:check
        continue-on-error: true
      - run: pnpm test:architecture
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        if: github.event_name == 'pull_request'
      - run: pnpm test
      - name: Coverage report
        run: pnpm exec turbo test -- --coverage --coverage.reporter=json-summary --coverage.reporter=text
        continue-on-error: true
      - name: Quality Gates (passive — não bloqueia merge)
        if: github.event_name == 'pull_request'
        run: node .quality-gates/quality-gate.mjs --check
        continue-on-error: true
      - name: Upload quality gates report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-report
          path: .quality-gates/output/
          retention-days: 14
      - name: Comentário no PR com diff vs baseline
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-gates
          path: .quality-gates/output/report.md
