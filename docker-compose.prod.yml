services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
      - chat-server

  server:
    image: ${DOCKERHUB_USERNAME}/bens-server:latest
    restart: always
    command: ["node", "dist/server.js"]
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    image: ${DOCKERHUB_USERNAME}/bens-server:latest
    restart: always
    command: ["node", "dist/worker.js"]
    env_file: .env
    depends_on:
      - postgres
      - redis

  chat-server:
    image: ${DOCKERHUB_USERNAME}/bens-chat:latest
    restart: always
    command: ["node", "dist/index.js"]
    env_file: .env
    depends_on:
      - mongodb
      - redis

  chat-worker:
    image: ${DOCKERHUB_USERNAME}/bens-chat:latest
    restart: always
    command: ["node", "dist/worker.js"]
    env_file: .env
    volumes:
      - baileys-auth:/app/auth
    depends_on:
      - mongodb
      - redis

  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  mongo-data:
  redis-data:
  baileys-auth:
