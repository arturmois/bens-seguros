services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bens
      POSTGRES_PASSWORD: bens_dev
      POSTGRES_DB: bens_seguros
    volumes:
      - pg-data:/var/lib/postgresql

  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db

  mongo-init:
    image: mongo:8
    depends_on:
      - mongodb
    restart: "no"
    command: >
      mongosh --host mongodb --eval "
        try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }
        catch(e) { if (e.codeName !== 'AlreadyInitialized') throw e; }
      "

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass bens_dev
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  mongo-data:
  redis-data:
